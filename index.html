<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow & Blade - Agendamento Premium</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#D4AF37',
              goldHover: '#AA8C2C',
              darkBg: '#121212',
              cardBg: '#1E1E1E',
              accentPink: '#EC4899',
              accentPinkHover: '#DB2777'
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-brand-darkBg text-gray-100 font-sans min-h-screen pb-20 md:pb-0">

  <!-- NOTIFICAÇÕES TOAST -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

  <!-- NAVBAR TOP -->
  <header class="bg-brand-cardBg border-b border-gray-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
        <i class="fa-solid fa-[#D4AF37] fa-scissors text-2xl text-brand-gold"></i>
        <span class="text-xl font-bold tracking-wider text-white">GLOW <span class="text-brand-gold">&</span> BLADE</span>
      </div>
      
      <!-- Desktop Menu -->
      <nav class="hidden md:flex items-center gap-6" id="desktop-nav">
        <a href="#" onclick="navigateTo('home')" class="hover:text-brand-gold transition">Início</a>
        <a href="#" onclick="navigateTo('booking')" class="hover:text-brand-gold transition">Agendar</a>
        <div id="auth-links-desktop" class="flex items-center gap-4">
          <!-- Injetado dinamicamente via JS -->
        </div>
      </nav>
    </div>
  </header>

  <!-- CONTEÚDO DINÂMICO (SPA VIEWS) -->
  <main id="app-content" class="max-w-7xl mx-auto px-4 py-6">
    <!-- As páginas serão renderizadas via JavaScript -->
  </main>

  <!-- NAVBAR MOBILE INFERIOR -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-brand-cardBg border-t border-gray-800 z-40 flex justify-around py-3 text-xs text-gray-400">
    <button onclick="navigateTo('home')" class="flex flex-col items-center gap-1 hover:text-brand-gold">
      <i class="fa-solid fa-house text-lg"></i> Início
    </button>
    <button onclick="navigateTo('booking')" class="flex flex-col items-center gap-1 hover:text-brand-gold">
      <i class="fa-solid fa-calendar-plus text-lg"></i> Agendar
    </button>
    <button id="mobile-my-appts-btn" onclick="navigateTo('my-appointments')" class="flex flex-col items-center gap-1 hover:text-brand-gold hidden">
      <i class="fa-solid fa-clock-rotate-left text-lg"></i> Agenda
    </button>
    <button id="mobile-profile-btn" onclick="navigateTo('profile')" class="flex flex-col items-center gap-1 hover:text-brand-gold">
      <i class="fa-solid fa-user text-lg"></i> Perfil
    </button>
  </nav>

  <!-- Import do SDK Firebase JavaScript v10 -->
  <script type="module" src="app.js"></script>
</body>
          </html>
